# Dukaan AI — app release builds (Phase F design §7.2/§7.3).
# Manual or app-v* tag. Android ships DEBUG-SIGNED and labelled
# INTERNAL until the owner provisions the release keystore secrets
# (ANDROID_KEYSTORE_BASE64 / ANDROID_KEY_ALIAS / ANDROID_KEY_PASSWORD /
# ANDROID_STORE_PASSWORD) — the workflow switches to release signing
# automatically when they exist. Windows is packaged with Inno
# Setup (Q3), per-user install, unsigned initially.
name: app-release

on:
  workflow_dispatch:
  push:
    tags:
      - "app-v*"

env:
  FLUTTER_VERSION: "3.35.6"

jobs:
  android:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          cache: true

      # Binary assets: restore any base64 sidecars (the text-only
      # push route), then assert the eight real binaries — fail
      # loudly, never silently.
      - name: Binary assets present
        working-directory: flutter-app
        run: |
          while IFS= read -r f; do base64 -d "$f" > "${f%.b64}"; done < <(find . -name '*.b64' -not -path './build/*')
          for p in \
            assets/fonts/NotoNastaliqUrdu-Regular.ttf \
            android/gradle/wrapper/gradle-wrapper.jar \
            android/app/src/main/res/mipmap-mdpi/ic_launcher.png \
            android/app/src/main/res/mipmap-hdpi/ic_launcher.png \
            android/app/src/main/res/mipmap-xhdpi/ic_launcher.png \
            android/app/src/main/res/mipmap-xxhdpi/ic_launcher.png \
            android/app/src/main/res/mipmap-xxxhdpi/ic_launcher.png \
            windows/runner/resources/app_icon.ico; do
            if [ ! -s "$p" ]; then echo "::error::Missing binary asset: $p"; exit 1; fi
          done
          echo "Binary assets: all 8 present."

      - name: Inject Firebase options (project dukan-8246)
        working-directory: flutter-app
        env:
          FIREBASE_OPTIONS_DART: ${{ secrets.FIREBASE_OPTIONS_DART }}
        run: |
          if [ -n "$FIREBASE_OPTIONS_DART" ]; then
            printf '%s' "$FIREBASE_OPTIONS_DART" > lib/data/firebase_options.dart
          else
            echo "::warning::FIREBASE_OPTIONS_DART secret not set — building with repo placeholders (app will compile but cannot reach the backend)."
          fi

      - name: Release keystore (when provisioned)
        working-directory: flutter-app/android
        env:
          KS: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        run: |
          if [ -n "$KS" ]; then
            printf '%s' "$KS" | base64 -d > app/release.keystore
            cat > key.properties <<KP
          storePassword=${{ secrets.ANDROID_STORE_PASSWORD }}
          keyPassword=${{ secrets.ANDROID_KEY_PASSWORD }}
          keyAlias=${{ secrets.ANDROID_KEY_ALIAS }}
          storeFile=release.keystore
          KP
          else
            echo "::warning::No keystore secrets — APK will be DEBUG-SIGNED (INTERNAL ONLY)."
          fi

      - name: Build APK
        working-directory: flutter-app
        run: |
          flutter pub get
          # §7.4: the +N build number is CI-stamped from the run
          # number on release builds (pubspec keeps 6.0.0+1).
          flutter build apk --release --build-number=${{ github.run_number }}
          APK=$(ls build/app/outputs/flutter-apk/*.apk | head -1)
          if [ -f android/key.properties ]; then LABEL="release-signed"; else LABEL="INTERNAL-debug-signed-not-for-distribution"; fi
          cp "$APK" "dukaan-ai-${LABEL}.apk"
          sha256sum "dukaan-ai-${LABEL}.apk" > checksums.txt

      - uses: actions/upload-artifact@v4
        with:
          name: dukaan-ai-android
          path: |
            flutter-app/dukaan-ai-*.apk
            flutter-app/checksums.txt

  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          cache: true

      # Binary assets: restore any base64 sidecars (the text-only
      # push route), then assert the eight real binaries — fail
      # loudly, never silently.
      - name: Binary assets present
        working-directory: flutter-app
        shell: pwsh
        run: |
          Get-ChildItem -Recurse -Filter *.b64 | Where-Object { $_.FullName -notmatch '\\build\\' } | ForEach-Object {
            [IO.File]::WriteAllBytes(($_.FullName -replace '\.b64$',''), [Convert]::FromBase64String((Get-Content $_.FullName -Raw)))
          }
          $paths = @(
            'assets/fonts/NotoNastaliqUrdu-Regular.ttf',
            'android/gradle/wrapper/gradle-wrapper.jar',
            'android/app/src/main/res/mipmap-mdpi/ic_launcher.png',
            'android/app/src/main/res/mipmap-hdpi/ic_launcher.png',
            'android/app/src/main/res/mipmap-xhdpi/ic_launcher.png',
            'android/app/src/main/res/mipmap-xxhdpi/ic_launcher.png',
            'android/app/src/main/res/mipmap-xxxhdpi/ic_launcher.png',
            'windows/runner/resources/app_icon.ico')
          foreach ($p in $paths) {
            if (-not (Test-Path $p) -or (Get-Item $p).Length -eq 0) {
              Write-Host "::error::Missing binary asset: $p"; exit 1
            }
          }
          Write-Host "Binary assets: all 8 present."

      - name: Inject Firebase options (project dukan-8246)
        working-directory: flutter-app
        shell: pwsh
        env:
          FIREBASE_OPTIONS_DART: ${{ secrets.FIREBASE_OPTIONS_DART }}
        run: |
          if ($env:FIREBASE_OPTIONS_DART) {
            Set-Content -Path lib/data/firebase_options.dart -Value $env:FIREBASE_OPTIONS_DART -NoNewline
          } else {
            Write-Host "::warning::FIREBASE_OPTIONS_DART not set — placeholder build."
          }

      - name: Build Windows release
        working-directory: flutter-app
        # §7.4: +N build number CI-stamped from the run number.
        run: flutter build windows --release --build-number=${{ github.run_number }}

      - name: Package with Inno Setup
        working-directory: flutter-app
        run: |
          choco install innosetup --no-progress -y
          & "C:\Program Files (x86)\Inno Setup 6\ISCC.exe" windows\installer\dukaan_ai.iss

      - name: Checksums
        working-directory: flutter-app
        shell: pwsh
        run: |
          Get-ChildItem build/windows-installer/*.exe | ForEach-Object {
            $h = Get-FileHash $_.FullName -Algorithm SHA256
            "$($h.Hash.ToLower())  $($_.Name)" | Out-File -Encoding ascii checksums-windows.txt -Append
          }
          Get-Content checksums-windows.txt

      - uses: actions/upload-artifact@v4
        with:
          name: dukaan-ai-windows
          path: |
            flutter-app/build/windows-installer/*.exe
            flutter-app/checksums-windows.txt
