# Codemagic — Dukaan AI Android APK build
# Runs `flutter analyze` and builds a release APK on every push to main.
# No Android SDK needed locally: the whole toolchain runs in the cloud.

workflows:
  android-apk:
    name: Android APK
    max_build_duration: 60
    instance_type: mac_mini_m2
    environment:
      flutter: stable
      xcode: latest
      cocoapods: default
      vars:
        PACKAGE_NAME: "com.codehubb.dukaanai"
    scripts:
      - name: Flutter analyze
        script: flutter analyze
      - name: Build release APK
        script: flutter build apk --release
    artifacts:
      - build/app/outputs/flutter-apk/app-release.apk
    publishing:
      email:
        recipients:
          - owner@example.com
