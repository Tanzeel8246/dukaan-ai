name: dukaan_ai
description: Dukaan AI — kiryana shop intelligence, offline-first Flutter companion app.
publish_to: "none"
version: 1.0.0+1

environment:
  sdk: ">=3.4.0 <4.0.0"

dependencies:
  flutter:
    sdk: flutter
  provider: ^6.1.2
  sqflite: ^2.3.3+1
  path: ^1.9.0
  intl: ^0.19.0
  uuid: ^4.5.1
  # Firebase is OPTIONAL. The app runs fully offline on sqflite without it.
  # Add google-services.json / GoogleService-Info.plist to enable sync.
  firebase_core: ^3.8.0
  cloud_firestore: ^5.5.0
  firebase_auth: ^5.3.4

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0

flutter:
  uses-material-design: true
