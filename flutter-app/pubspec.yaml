name: dukaan_ai
description: "Dukaan AI — counter + back-office client for the Dukaan AI ERP (Phase F). Same Firebase project, same journal contract as the web app."
publish_to: "none"
version: 6.0.0+1

environment:
  sdk: ">=3.4.0 <4.0.0"
  flutter: ">=3.24.0"

dependencies:
  flutter:
    sdk: flutter
  provider: "6.1.2"
  intl: "0.20.2"
  uuid: "4.5.1"
  firebase_core: "3.15.2"
  cloud_firestore: "5.6.12"
  firebase_auth: "5.7.0"
  flutter_secure_storage: "9.2.4"
  pointycastle: "3.9.1"
  crypto: "3.0.6"
  printing: "5.13.4"
  pdf: "3.11.1"
  esc_pos_utils_plus: "2.0.4"
  path_provider: "2.1.5"
  shared_preferences: "2.3.3"
  file_picker: "8.1.7"
  share_plus: "10.1.4"
  image: "4.3.0"
  print_bluetooth_thermal: ^1.2.1
  usb_serial: ^0.5.2

dev_dependencies:
  flutter_test:
    sdk: flutter

flutter:
  uses-material-design: true
  fonts:
    - family: NotoNastaliqUrdu
      fonts:
        - asset: assets/fonts/NotoNastaliqUrdu-Regular.ttf
    - family: NotoNaskhArabic
      fonts:
        - asset: assets/fonts/NotoNaskhArabic-Regular.ttf
        - asset: assets/fonts/NotoNaskhArabic-Bold.ttf
          weight: 700
  assets:
    - lib/l10n/strings_en.json
    - lib/l10n/strings_ur.json
    - lib/l10n/strings_ps.json
    - lib/l10n/strings_fa.json
