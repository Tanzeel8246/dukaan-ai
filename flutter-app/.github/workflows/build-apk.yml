# GitHub Actions — build a release APK for Dukaan AI.
# Trigger: manual (workflow_dispatch) or push to main.
# The APK is uploaded as a build artifact; grab it from the Actions tab.

name: Build Android APK

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "flutter-app/**"

jobs:
  build-apk:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: flutter-app
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: "temurin"
          java-version: "17"

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Install dependencies
        run: flutter pub get

      - name: Analyze
        run: flutter analyze

      - name: Build release APK
        run: flutter build apk --release

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: dukaan-ai-apk
          path: flutter-app/build/app/outputs/flutter-apk/app-release.apk
